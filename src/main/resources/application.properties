server.address=0.0.0.0
server.port=8081

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://gateway01.eu-central-1.prod.aws.tidbcloud.com:4000/singsationdb?useSSL=true&requireSSL=true&enabledTLSProtocols=TLSv1.2&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:2HLqHWgUHhsnPba.root}
spring.datasource.password=${DB_PASSWORD:0ReeRFk5VxIcPH2V}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ============================================================================
# JSON SERIALIZATION
# ============================================================================
spring.jackson.serialization.fail-on-empty-beans=false

# ============================================================================
# JWT CONFIGURATION
# ============================================================================
jwt.secret=${JWT_SECRET:mySecretKeyForJWTGeneration2026SingsationAppThatIsNowLongEnoughForHS512AlgorithmSecureKey}
jwt.expiration=86400000

# ============================================================================
# CORS CONFIGURATION
# ============================================================================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://10.0.2.2,http://localhost}

# ============================================================================
# LOGGING
# ============================================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.security=DEBUG

# ============================================================================
# DEFAULT ADMIN CREDENTIALS (for Spring Security basic auth)
# ============================================================================
spring.security.user.name=${SPRING_ADMIN_USER:admin}
spring.security.user.password=${SPRING_ADMIN_PASSWORD:pleaseChangeMe}

# ============================================================================
# YOCO PAYMENT CONFIGURATION
# ============================================================================
yoco.secret.key=${YOCO_SECRET_KEY}
yoco.public.key=${YOCO_PUBLIC_KEY}
yoco.api.url=https://payments.yoco.com/api
yoco.webhook.secret=${YOCO_WEBHOOK_SECRET}
yoco.payment.amount=5000
yoco.payment.currency=ZAR
yoco.payment.description=Sing-Sation Karaoke Video Download

# ============================================================================
# LOGIC SMS OTP CONFIGURATION
# ============================================================================
logicsms.otp.url=https://www.logicsms.co.za/postmsg2.aspx
logicsms.username=${LOGICSMS_USERNAME}
logicsms.password=${LOGICSMS_PASSWORD}
logicsms.originator=REPLY

# ============================================================================
# EMAIL CONFIGURATION
# ============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================================
# ORACLE OBJECT STORAGE BUCKETS
# ============================================================================
oracle.bucket.songs=${ORACLE_BUCKET_SONGS}
oracle.bucket.videos=${ORACLE_BUCKET_VIDEOS}
oracle.bucket.images=${ORACLE_BUCKET_IMAGES}
oracle.bucket.storage=${ORACLE_BUCKET_STORAGE}

# ============================================================================
# FILE UPLOAD LIMITS
# ============================================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB